# Full local stack: SQL Server -> Flyway migrations -> .NET API (+ Hangfire) -> React UI
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Your_strong_Passw0rd}
    ports: ["1433:1433"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"IF DB_ID('HardshipDesk') IS NULL CREATE DATABASE HardshipDesk\" || exit 1"]
      interval: 10s
      retries: 12

  migrate:
    image: redgate/flyway:latest
    depends_on:
      sqlserver: { condition: service_healthy }
    volumes: ["./database/migrations:/flyway/sql:ro"]
    command: >
      -url="jdbc:sqlserver://sqlserver:1433;databaseName=HardshipDesk;encrypt=true;trustServerCertificate=true"
      -user=sa -password=${MSSQL_SA_PASSWORD:-Your_strong_Passw0rd} -locations=filesystem:/flyway/sql migrate

  api:
    build:
      context: ./backend
      dockerfile: HardshipDesk.Api/Dockerfile
    depends_on:
      migrate: { condition: service_completed_successfully }
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__HardshipDesk: "Server=sqlserver,1433;Database=HardshipDesk;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Your_strong_Passw0rd};TrustServerCertificate=True"
      Cors__Origins__0: "http://localhost:5173"
    ports: ["5080:8080"]
