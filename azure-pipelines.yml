# Azure DevOps CI: database migrations are validated, API built and tested, UI built and tested.
trigger:
  branches: { include: [main] }
pr:
  branches: { include: [main] }

pool:
  vmImage: ubuntu-latest

stages:
  - stage: Build
    jobs:
      - job: Api
        displayName: .NET API
        steps:
          - task: UseDotNet@2
            inputs: { packageType: sdk, version: 8.0.x }
          - script: dotnet restore backend/HardshipDesk.sln
            displayName: Restore
          - script: dotnet build backend/HardshipDesk.sln -c Release --no-restore
            displayName: Build
          - script: dotnet test backend/HardshipDesk.sln -c Release --no-build --logger trx --results-directory $(Agent.TempDirectory)/tests
            displayName: Unit tests
          - task: PublishTestResults@2
            condition: succeededOrFailed()
            inputs: { testResultsFormat: VSTest, testResultsFiles: '$(Agent.TempDirectory)/tests/*.trx' }
          - script: dotnet publish backend/HardshipDesk.Api/HardshipDesk.Api.csproj -c Release -o $(Build.ArtifactStagingDirectory)/api
            displayName: Publish
          - publish: $(Build.ArtifactStagingDirectory)/api
            artifact: api

      - job: Web
        displayName: React UI
        steps:
          - task: NodeTool@0
            inputs: { versionSpec: 22.x }
          - script: npm ci && npm test && npm run build
            workingDirectory: frontend
            displayName: Install, test, build
          - publish: frontend/dist
            artifact: web

      - job: Database
        displayName: Migrations (Flyway against a throwaway SQL Server)
        steps:
          - script: |
              docker run -d --name sql -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD='Ci_Passw0rd!' -p 1433:1433 mcr.microsoft.com/mssql/server:2022-latest
              for i in $(seq 1 30); do docker exec sql /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Ci_Passw0rd!' -Q "CREATE DATABASE HardshipDesk" && break; sleep 3; done
              docker run --rm --network host -v $(Build.SourcesDirectory)/database/migrations:/flyway/sql redgate/flyway:latest \
                -url="jdbc:sqlserver://localhost:1433;databaseName=HardshipDesk;encrypt=true;trustServerCertificate=true" \
                -user=sa -password='Ci_Passw0rd!' -locations=filesystem:/flyway/sql migrate
            displayName: Apply migrations to a clean database
